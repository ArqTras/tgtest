services:
  ollama:
    image: ollama/ollama:latest
    container_name: kontekst-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ollama-init:
    image: ollama/ollama:latest
    container_name: kontekst-ollama-init
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_BASE_MODEL: ${OLLAMA_BASE_MODEL:-qwen3:14b}
      OLLAMA_LOCAL_MODEL: ${OLLAMA_LOCAL_MODEL:-qwen3-14b-bot}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-16}
    volumes:
      - ./scripts/ollama-init.sh:/ollama-init.sh:ro
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    restart: "no"

  kontekst:
    build: .
    image: kontekst-bot:local
    container_name: kontekst-bot
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "${HTTP_PORT:-8787}:8787"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3-14b-bot}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      HTTP_PORT: "8787"
      DATA_DIR: /data
      SOURCES_DIR: /sources
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-false}
      LEARN_EVERY: ${LEARN_EVERY:-1}
    volumes:
      - kontekst-data:/data
      - kontekst-sources:/sources
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kontekst-data:
  kontekst-sources:
  ollama-data:
